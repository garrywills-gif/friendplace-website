# Path-based reverse proxy on port 3000. Persistent copy lives in /app
# so it survives container restarts (/etc/nginx is ephemeral).
#
# Route table:
#   /admin/*, /_next/*, /api/uploads/*         → Next.js website (:3001)
#   Marketing site public routes (list below) → Next.js website (:3001)
#   everything else                            → Expo Metro (:3002)

user root;
events { worker_connections 1024; }

http {
    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log;
    client_max_body_size 20m;

    upstream expo_upstream    { server 127.0.0.1:3002; }
    upstream website_upstream { server 127.0.0.1:3001; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3000 default_server;
        server_name _;

        # ── Admin / bundler / uploads ────────────────────────────
        location ^~ /admin        { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /_next        { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /api/uploads  { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }

        # ── Marketing site public routes ─────────────────────────
        # These are the pages the CMS drives content for. Adding a new
        # public route on the website? List it here so it's reachable
        # via the preview URL. The prod website (on friendplace.com.au
        # via Vercel) doesn't use this proxy — it serves Next.js directly.
        location ^~ /about            { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /how-it-works     { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /features         { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /faqs             { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /events            { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /success-stories  { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /contact          { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /robots.txt       { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }

        # ── Everything else → Expo mobile web preview ────────────
        location / {
            proxy_pass http://expo_upstream;
            include /app/config/nginx/proxy-common.conf;
        }
    }
}
