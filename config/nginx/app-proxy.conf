# Path-based reverse proxy on port 3000. Persistent copy lives in /app
# so it survives container restarts (/etc/nginx is ephemeral).
#
# Route table:
#   /admin/*, /_next/*, /api/uploads/*         → Next.js website (:3001)
#   Marketing site public routes (list below) → Next.js website (:3001)
#   everything else                            → Expo Metro (:3002)

user root;
events { worker_connections 1024; }

http {
    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log;
    client_max_body_size 20m;

    upstream expo_upstream    { server 127.0.0.1:3002; }
    upstream website_upstream { server 127.0.0.1:3001; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3000 default_server;
        server_name _;

        # ── Admin / bundler / uploads ────────────────────────────
        location ^~ /admin        { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /_next        { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /api/uploads  { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }

        # ── Marketing site public routes ─────────────────────────
        # These are the pages the CMS drives content for. Adding a new
        # public route on the website? List it here so it's reachable
        # via the preview URL. The prod website (on friendplace.com.au
        # via Vercel) doesn't use this proxy — it serves Next.js directly.
        location ^~ /about            { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /how-it-works     { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /features         { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /faqs             { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }

        # ── /events routing ──────────────────────────────────────
        # Both the mobile app AND the marketing website live at
        # `/events` — pathwise this creates a collision. Resolve it
        # by giving the *mobile app* priority for the exact `/events`
        # URL (that's where the "Local Events" screen lives), plus its
        # sub-routes `/events/new` and `/events/edit/[id]`. Everything
        # else under `/events/*` (event detail pages, RSVP magic-link
        # cancellation pages) goes to the marketing website.
        #
        # nginx precedence: exact-match (`=`) > prefix-with-boost (`^~`),
        # so these blocks resolve in the intended order regardless of
        # source-file position.
        location = /events            { proxy_pass http://expo_upstream;    include /app/config/nginx/proxy-common.conf; }
        location = /events/new        { proxy_pass http://expo_upstream;    include /app/config/nginx/proxy-common.conf; }
        location ^~ /events/edit      { proxy_pass http://expo_upstream;    include /app/config/nginx/proxy-common.conf; }
        location ^~ /events/          { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }

        location ^~ /success-stories  { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /list-your-event  { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /contact          { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /robots.txt       { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }

        # ── Public "front door" routes ──────────────────────────
        # /meet is the permanent front door of FriendPlace — the
        # butterfly greeting experience. /register-interest is the
        # Register-Your-Interest form + Phase-C submit endpoint.
        # /audio/* serves the pre-rendered Ash/Nova greeting clips;
        # /brand-assets/* serves the butterfly + banner PNGs.
        # /privacy and /terms are the standard legals.
        # /butterfly-lab is the internal choreography sandbox and
        # is left proxied here so QA can still visit it directly.
        location ^~ /meet             { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /register-interest{ proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /butterfly-lab    { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /audio/           { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /brand-assets/    { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /privacy          { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }
        location ^~ /terms            { proxy_pass http://website_upstream; include /app/config/nginx/proxy-common.conf; }

        # ── Everything else → Expo mobile web preview ────────────
        location / {
            proxy_pass http://expo_upstream;
            include /app/config/nginx/proxy-common.conf;
        }
    }
}
