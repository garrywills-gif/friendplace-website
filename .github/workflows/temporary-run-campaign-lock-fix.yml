name: Run campaign lock repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-run-campaign-lock-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded patch
        run: python scripts/apply_campaign_lock_fix.py
      - name: Verify campaign invariants
        run: node scripts/check-campaign-invariants.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/temporary-run-campaign-lock-fix.yml
          git config user.name 'FriendPlace Campaign Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Lock campaign composer against autosave regressions'
          git push
